name: Flutter quality and Android debug build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android and iOS project scaffolds
        run: flutter create --platforms=android,ios --project-name game_004_2048_merge_world .
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze Dart and Flutter
        run: flutter analyze --fatal-infos
      - name: Run unit and widget tests
        run: flutter test --reporter expanded
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: game-004-2048-merge-world-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
