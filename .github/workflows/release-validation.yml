name: Android and iOS unsigned release compilation
on:
  workflow_dispatch:
  pull_request:
jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,ios --project-name game_004_2048_merge_world .
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: game-004-android-unsigned-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
  ios-compile:
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,ios --project-name game_004_2048_merge_world .
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: game-004-ios-unsigned-runner
          path: build/ios/iphoneos/Runner.app/**
          if-no-files-found: error
